<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勤怠タイムカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>勤怠タイムカード</h1>
    <div class="acct" id="acct" hidden>
      <button class="btn small menu-open" id="menu-open" type="button" aria-controls="drawer" aria-expanded="false">☰ メニュー</button>
      <p class="who" id="who"></p>
      <button class="btn small" id="logout" type="button">ログアウト</button>
    </div>
  </header>
  <div class="notice" id="notice" role="status" hidden></div>

  <!-- ログイン -->
  <section class="panel login" id="login-view" hidden>
    <h2>ログイン</h2>
    <form id="login-form" autocomplete="on">
      <div class="fields">
        <div class="field"><label for="l-emp">メールアドレス</label><input id="l-emp" name="username" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label for="l-pw">パスワード</label><input id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
      </div>
      <div class="actions"><button class="btn in block" type="submit">ログイン</button></div>
    </form>
  </section>

  <!-- 初回ログイン時のパスワード変更 -->
  <section class="panel login" id="force-view" hidden>
    <h2>パスワードの設定</h2>
    <p class="hint">管理者から受け取った仮パスワードのままでは利用できません。ご自身のパスワードを設定してください。</p>
    <form id="force-form">
      <div class="fields">
        <div class="field"><label for="f-cur">仮パスワード</label><input id="f-cur" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="f-new">新しいパスワード（8文字以上）</label><input id="f-new" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="f-new2">新しいパスワード（確認）</label><input id="f-new2" type="password" autocomplete="new-password" minlength="8" required></div>
      </div>
      <div class="actions"><button class="btn in block" type="submit">パスワードを設定して始める</button></div>
    </form>
  </section>

  <!-- タイムカード -->
  <main class="grid" id="app-view" hidden>
    <div class="rail">
      <section class="panel" aria-label="打刻">
        <p class="clock-date" id="clock-date"></p>
        <p class="clock" id="clock" aria-live="off">--:--:--</p>
        <div class="clock-row">
          <span class="label">日本標準時 JST</span>
          <span class="pill" id="status" data-s="idle">未出勤</span>
        </div>
        <div class="btns" id="btns"></div>
        <div class="today-log" id="today-log"></div>
      </section>

      <details class="panel settings" id="settings">
        <summary>勤務設定・パスワード</summary>
        <div class="fields">
          <div class="field"><label for="s-start">始業時刻</label><input id="s-start" type="time"></div>
          <div class="field"><label for="s-end">終業時刻</label><input id="s-end" type="time"></div>
          <div class="field"><label for="s-std">所定労働時間（時間）</label><input id="s-std" type="number" min="1" max="12" step="0.25"></div>
          <div class="field"><label for="s-brk">所定休憩（分）</label><input id="s-brk" type="number" min="0" max="240" step="5"></div>
        </div>
        <p class="hint">休憩を打刻しなかった日は、6時間を超える勤務に所定休憩を差し引きます。残業は所定労働時間を超えた分、深夜は22時から翌5時の勤務です。</p>
        <div class="actions"><button class="btn small in" id="s-save" type="button">設定を保存</button></div>
        <div class="fields">
          <div class="field wide"><label for="pw-cur">現在のパスワード</label><input id="pw-cur" type="password" autocomplete="current-password"></div>
          <div class="field wide"><label for="pw-new">新しいパスワード（8文字以上）</label><input id="pw-new" type="password" autocomplete="new-password"></div>
        </div>
        <div class="actions"><button class="btn small" id="pw-save" type="button">パスワードを変更</button></div>
      </details>
    </div>

    <section class="sheet" aria-label="月次勤怠表">
      <div class="sheet-head">
        <div class="month-nav">
          <button class="iconbtn" id="prev" type="button" aria-label="前の月">‹</button>
          <h2 id="month-title"></h2>
          <button class="iconbtn" id="next" type="button" aria-label="次の月">›</button>
        </div>
        <div class="tools">
          <button class="btn small" id="this-month" type="button">今月</button>
          <button class="btn small in" id="xlsx" type="button">Excelを保存</button>
          <button class="btn small" id="csv" type="button">CSVを保存</button>
        </div>
      </div>

      <div class="totals" id="totals"></div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>日</th><th>曜</th><th>区分</th>
              <th class="num">出勤</th><th class="num">退勤</th><th class="num">休憩</th>
              <th class="num">実働</th><th class="num">残業</th><th class="num">深夜</th><th>備考</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="hint flush">行を選ぶと、打刻の修正・有給休暇などの登録ができます。変更は履歴に記録されます。</p>

      <section class="panel editor" id="editor" hidden></section>
    </section>
  </main>

  <!-- 追加機能の画面（振替・交通費・立替・現場情報・キャリアシート）。中身は pages.js が作る -->
  <main class="feature" id="feature-view" hidden></main>
</div>
<!-- サイドメニュー -->
<div class="drawer-back" id="drawer-back" hidden></div>
<nav class="drawer" id="drawer" aria-label="メニュー" aria-hidden="true">
  <button class="drawer-close" id="menu-close" type="button" aria-label="メニューを閉じる">×</button>
  <div class="mgroup">
    <button class="mhead" type="button" data-toggle="g-work" aria-expanded="true"><span>勤怠・交通費</span><i class="mico" aria-hidden="true"></i></button>
    <ul class="msub" id="g-work">
      <li><button type="button" data-go="register" class="on">勤怠登録</button></li>
      <li><button type="button" data-go="edit">勤怠修正</button></li>
      <li><button type="button" data-go="transfer">振替管理</button></li>
      <li><button type="button" data-go="transport_site">交通費(現場請求用)</button></li>
      <li><button type="button" data-go="transport_internal">交通費(社内向け)</button></li>
      <li><button type="button" data-go="expense">立替申請</button></li>
      <li><button type="button" data-go="sites">現場情報</button></li>
      <li><button type="button" data-go="print">フォーマット印刷</button></li>
    </ul>
  </div>
  <div class="mgroup plain">
    <button class="mhead light" type="button" data-toggle="g-career" aria-expanded="false"><span>キャリアデザインシート<br>(経歴更新)</span><i class="mico plus" aria-hidden="true"></i></button>
    <ul class="msub" id="g-career" hidden>
      <li><button type="button" data-go="career">経歴更新</button></li>
    </ul>
  </div>
  <label class="mauto"><input type="checkbox" id="auto-xlsx" checked> 保存するとき、Excelも自動で保存する</label>
</nav>
<script src="/calc.js"></script>
<script src="/app.js"></script>
<script src="/pages.js"></script>
<script src="/menu.js"></script>
</body>
</html>
